<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" role="img" aria-label="SpeakCall — סמל נושם"><title>SpeakCall — סמל נושם</title><style>
@keyframes sc-breathe {0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.025)}}
@keyframes sc-halo {0%,100%{opacity:.35;transform:scale(.98)}50%{opacity:.7;transform:scale(1.025)}}
.sc-breathe{transform-box:fill-box;transform-origin:center;animation:sc-breathe 4s ease-in-out infinite}
.sc-halo{transform-box:fill-box;transform-origin:center;animation:sc-halo 4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.sc-breathe,.sc-halo{animation:none!important}}
