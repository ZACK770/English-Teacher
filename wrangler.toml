name = "english-engine"
main = "cloudflare/src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
SALES_OFFER_EXTENSION_ID = "14341"
SALES_OFFER_MODE = "on"
SALES_OFFER_SKIP_PRACTICE = "1"
SALES_OFFER_ALLOWLIST = "0527180504"
SALES_OFFER_TEST_PHONES = ""
SALES_OFFER_EXCLUDE_PHONES = "0527180504"
SALES_OFFER_TEST_AT = "2026-11-25T14:25:00.000Z"
SALES_OFFER_AUDIENCE = "rolling"
SALES_OFFER_ROLLING_START_AT = "2026-11-25T13:40:00.000Z"
SALES_OFFER_MIN_TUTOR_CALLS = "2"
SALES_OFFER_MIN_TUTOR_MINUTES = "1000000"
CALL_REVIEW_ENABLED = "1"
RECORD_PHONE_CALLS = "1"
GA_MEASUREMENT_ID = ""
CF_BEACON_TOKEN = "9bbae75ae72c4010961886b5be1e0df9"

# Release: v1.1.0 - Shochi AI Robot Teacher, Learning Games, Excel Unit Economics & Merhav CRM Sync
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[ai]
binding = "AI"

[[r2_buckets]]
binding = "VOICEMAIL_AUDIO"
bucket_name = "english-engine-voicemails"

[[d1_databases]]
binding = "DB"
database_name = "english-engine"
database_id = "240c0754-3fc2-4da9-8d6e-72df75faa3a1"
migrations_dir = "cloudflare/migrations"

[[durable_objects.bindings]]
name = "CALLS"
class_name = "CallSession"

[[durable_objects.bindings]]
name = "GEMINI_BUDGET"
class_name = "GeminiBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CallSession"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GeminiBudget"]

[[send_email]]
name = "GEMINI_BUDGET_EMAIL"
allowed_sender_addresses = ["alerts@speakcall.app"]

[[send_email]]
name = "PORTAL_EMAIL"
allowed_sender_addresses = ["noreply@speakcall.app"]

[triggers]
crons = ["*/10 * * * *", "*/5 * * * *"]

[observability]
enabled = true
redact_query_string = true
