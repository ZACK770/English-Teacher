<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>דיבורא · הלמידה שלי</title><link rel="stylesheet" href="/console-assets/console.css"><script src="/console-assets/portal.js" defer></script></head><body><header class="top"><a class="brand" href="/learn">דיבורא · הלמידה שלי</a><button id="exit" class="ghost">יציאה</button></header><main><div id="entry" class="panel"><h1>נעים להיפגש.</h1><p>היכנס עם קישור אישי שקיבלת מהשירות.</p><form id="entryForm"><label>קוד כניסה<input id="portalToken" type="password" autocomplete="off" required></label><button class="primary">כניסה</button></form></div><div id="lessonApp" hidden><div class="page-head"><div><span class="eyebrow">כל שיחה היא צעד קדימה</span><h1 id="name"></h1><p>החשבון וההתקדמות שלך משותפים לאתר ולטלפון.</p></div></div><section id="stats" class="metrics"></section><div class="grid2"><section class="panel"><div class="panel-head"><h2>זמן לתרגל</h2><select id="teacher" aria-label="בחירת מורה"></select></div><p>כתוב משפט או שאלה. המורה יענה בטקסט ובקול.</p><div id="conversation" aria-live="polite"></div><form id="turnForm"><label>מה תרצה לומר?<textarea id="message" maxlength="4000" required dir="auto"></textarea></label><div class="actions"><button class="primary" id="send">שליחה למורה ←</button></div></form></section><section class="panel"><h2>השיחות האחרונות שלי</h2><div id="history"></div></section></div></div><p id="error" role="alert"></p></main></body></html>
