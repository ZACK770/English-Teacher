name = "english-engine"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
GA_MEASUREMENT_ID = ""
CF_BEACON_TOKEN = "9bbae75ae72c4010961886b5be1e0df9"

# Release: v1.1.0 - Shochi AI Robot Teacher, Learning Games, Excel Unit Economics & Merhav CRM Sync
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[ai]
binding = "AI"

[[r2_buckets]]
binding = "VOICEMAIL_AUDIO"
bucket_name = "english-engine-voicemails"

[[d1_databases]]
binding = "DB"
database_name = "english-engine"
database_id = "240c0754-3fc2-4da9-8d6e-72df75faa3a1"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "CALLS"
class_name = "CallSession"

[[durable_objects.bindings]]
name = "GEMINI_BUDGET"
class_name = "GeminiBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CallSession"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GeminiBudget"]

[[send_email]]
name = "GEMINI_BUDGET_EMAIL"
allowed_sender_addresses = ["alerts@speakcall.app"]

[[send_email]]
name = "PORTAL_EMAIL"
allowed_sender_addresses = ["noreply@speakcall.app"]

[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
redact_query_string = true

# Isolated sandbox for web/AI development. Separate D1, secrets and URL; no cron, no PBX traffic.
[env.staging]
name = "english-engine-staging"
workers_dev = true

[[env.staging.d1_databases]]
binding = "DB"
database_name = "english-engine-staging"
database_id = "9f6c191a-2f80-4424-a1be-bc81f57e1249"
migrations_dir = "migrations"

[[env.staging.durable_objects.bindings]]
name = "CALLS"
class_name = "CallSession"

[[env.staging.durable_objects.bindings]]
name = "GEMINI_BUDGET"
class_name = "GeminiBudget"

[env.staging.triggers]
crons = []

[env.staging.vars]
STORE_TRANSCRIPTS = "1"
