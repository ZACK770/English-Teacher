name = "english-teacher-pilot-888"
account_id = "da53b4cd888030bba791621ea1a39f8c"
main = "src/pbx-pilot-worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false
keep_vars = true
routes = [
  { pattern = "speakcall.app/dashboard/pilot-888*", zone_name = "speakcall.app" },
  { pattern = "speakool.net/dashboard/pilot-888*", zone_name = "speakool.net" }
]

[vars]
PBX_CASCADE_PILOT = "1"
CONTENT_SAFETY_MODE = "on"
STORE_TRANSCRIPTS = "0"

[[d1_databases]]
binding = "DB"
database_name = "english-teacher-pilot-888"
database_id = "d7ac0fcf-9eac-48bc-88f6-71789d3d691b"
migrations_dir = "migrations"

[[d1_databases]]
binding = "ADMIN_DB"
database_name = "english-engine"
database_id = "240c0754-3fc2-4da9-8d6e-72df75faa3a1"

[[durable_objects.bindings]]
name = "CALLS"
class_name = "CallSession"

[[migrations]]
tag = "pilot-v1"
new_sqlite_classes = ["CallSession"]

[[durable_objects.bindings]]
name = "YIDDISH_CHANNELS"
class_name = "YiddishChannel"

[[migrations]]
tag = "yiddish-channel-v1"
new_sqlite_classes = ["YiddishChannel"]
