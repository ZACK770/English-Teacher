services:
  tutor:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - tutor-data:/app/data
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  tutor-data:
